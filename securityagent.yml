# ═══════════════════════════════════════════════════════════════
# Secure Code by Design – Project configuration
# Place this file in the root of your git repository.
#
# Documentation: https://scbydesign.com
# ═══════════════════════════════════════════════════════════════

# ── Deployment level ────────────────────────────────────────────
# maximum_privacy  – Everything runs locally, no code fragments sent externally
# balanced         – Default. Anonymised patterns sent for deep analysis
# maximum_analysis – Maximum AI analysis via Claude API
trust_level: balanced

# Which AI coding tool is used in this project? (informational only, does not affect scanning)
# claude_code | copilot | cursor | none
ai_coding_tool: none

# ── Blocking behaviour ──────────────────────────────────────────
# CRITICAL always blocks commit/push (cannot be disabled)
# HIGH blocks push by default – set to false to warn only
block_on_critical: true
block_on_high: true

# Always report all findings, even if action is warn or skip
report_all: true

# Time to wait for deep analysis results before proceeding with commit/push (in milliseconds)
deep_delay_ms: 2000

# ── Rule overrides ───────────────────────────────────────────────
# Override the action for specific rules: block | warn | report
#
# NOTE: The following rules are hard-locked and can NEVER be downgraded:
#   SECRET-001 (AWS keys), SECRET-002 (OpenAI keys),
#   SECRET-003 (GitHub tokens), SECRET-006 (PEM private keys),
#   SECRET-007 (JWT secrets), JWT-001 (JWT not verified)
#
# rule_overrides:
#   SECRET-005:
#     action: warn
#     reason: "Test environment – password does not block but warns"
#   FRONT-001:
#     action: warn
#     reason: "Public frontend keys managed via domain restriction"

# ── Exceptions ───────────────────────────────────────────────────
# Exceptions for specific findings that represent conscious, reviewed decisions.
#
# IMPORTANT: Never add exceptions as comments in source code.
# Comments like "// scd-ignore" leak information about what exists and where —
# visible to attackers and pentesters via DevTools or GitHub.
# All exceptions are managed here, in this file, which never reaches production.
#
# Create exceptions interactively with:
#   scd approve --rule FRONT-001 --file src/maps/config.js --line 12
#
# Fields:
#   id            – Unique exception ID (generated by CLI)
#   rule          – Rule ID being excepted (e.g. FRONT-001)
#   file          – Relative path to the file
#   line_range    – [from, to] line numbers
#   line_hash     – SHA-256 hash of the code line (generated by CLI)
#                   If the line changes, the hash no longer matches →
#                   the exception requires re-approval automatically
#   reason        – Justification (shown in audit trail and reports)
#   approved_by   – Email of the person who approved the exception
#   approved_date – Date of approval
#   expires       – Date for mandatory re-review
#
# exceptions:
#   - id: "exc-001"
#     rule: "FRONT-001"
#     file: "src/maps/mapbox-config.js"
#     line_range: [12, 12]
#     line_hash: "sha256:a3f9b2c1d4e5f6a7"
#     reason: "Mapbox public token – restricted via Mapbox dashboard (domain restriction)"
#     approved_by: "cto@company.com"
#     approved_date: "2026-03-01"
#     expires: "2026-09-01"
